<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resume Builder</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto; padding: 56px 20px 72px; max-width: 680px;
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    color: #1B1E22; background: #fff; text-align: center;
  }
  h1 { font-size: 32px; margin: 0 0 8px; color: #0B2545; }
  .tag { color: #646A73; margin: 0 0 36px; letter-spacing: 1.6px; text-transform: uppercase; font-size: 12px; }
  .mark {
    width: 96px; height: 96px; border-radius: 50%; background: #0683FE;
    margin: 0 auto 22px; display: flex; align-items: center; justify-content: center;
  }
  .sheet { width: 42px; height: 58px; background: #fff; border-radius: 6px; }
  p { color: #2B3036; text-align: left; }
  .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 34px; }
  .links a {
    display: inline-block; padding: 12px 22px; border-radius: 10px;
    background: #0B2545; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
  }
  .links a.ghost { background: #fff; color: #0B2545; border: 1px solid #C3C9D1; }
  footer { margin-top: 46px; color: #646A73; font-size: 14px; }
  a { color: #0683FE; }
</style>
</head>
<body>

<div class="mark"><div class="sheet"></div></div>
<h1>Resume Builder</h1>
<p class="tag">Your career, on one page</p>

<p>
  An offline resume builder for Android. Everything you write stays on your
  phone — there is no account, no sync and no server. Export to PDF or Word
  when you are done.
</p>

<div class="links">
  <a href="privacy.html">Privacy Policy</a>
  <a class="ghost" href="terms.html">Terms of Use</a>
</div>

<footer>
  Published by Dealtrix &middot;
  <a href="mailto:info@dealtrix.com">info@dealtrix.com</a>
</footer>

</body>
</html>
